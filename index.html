<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Express Numérique</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Express Numérique">
<meta name="theme-color" content="#25234A">
<style>
:root{--navy:#25234A;--pink:#D6336C;--bg:#DFE3EA;--card:#fff;--ink:#1a1a2e;--mut:#5b5f73;--ok:#178a4f;--wait:#c27a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e1a;--card:#1d1c38;--ink:#f1f2f7;--mut:#a5a8bd;--ok:#3ecf8e;--wait:#f0b429}}
:root[data-theme="dark"]{--bg:#0e0e1a;--card:#1d1c38;--ink:#f1f2f7;--mut:#a5a8bd;--ok:#3ecf8e;--wait:#f0b429}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:12px 14px 110px;position:relative}
h1,h2,.btn b,.type span,.tot,.paper h3{font-family:Oswald,'Arial Narrow','Roboto Condensed','Helvetica Neue',sans-serif}
.top{background:var(--pink);border-radius:20px;padding:14px;display:flex;align-items:center;gap:14px;color:#fff;position:relative}
.gearb{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.18);color:#fff;width:38px;height:38px}
.top img{border-radius:16px}.top h1{margin:0;font-size:24px;line-height:1.1;font-weight:700}
.btn{border:0;background:var(--navy);color:#fff;border-radius:16px;font:inherit;cursor:pointer;padding:14px 10px}
.btn:focus-visible,.fab:focus-visible,.ib:focus-visible,.row:focus-visible,input:focus-visible{outline:3px solid #19B5FE;outline-offset:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{text-align:center;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.stat b{font-size:20px;font-weight:700}.stat span{font-size:13px}.stat small{font-size:12px;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.type{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:92px;justify-content:center}
.type span{font-size:17px;font-weight:700;text-transform:uppercase}
.fab{position:fixed;bottom:calc(46px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}
footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));font:700 14px 'Arial Narrow',sans-serif;color:var(--mut);pointer-events:none}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.bar h2{margin:0;font-size:24px;text-transform:uppercase}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.fld{margin-bottom:14px}.fld label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;height:52px;border:2px solid transparent;border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:18px;padding:0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{display:flex;justify-content:space-between;align-items:baseline;background:var(--navy);color:#fff;border-radius:16px;padding:16px;margin:6px 0 12px}
.sum b{font:700 28px 'Arial Narrow',sans-serif}.err{color:var(--pink);min-height:22px;margin:0 0 8px;font-weight:600}
.go{width:100%;height:56px;font-size:18px;font-weight:600;background:var(--pink)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;height:42px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font:600 14px system-ui,sans-serif;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--navy);color:#fff}
.row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.row small{display:block;color:var(--mut)}.row div:last-child{text-align:right}.row em{display:block;font-style:normal;font-size:13px;font-weight:600}
.ok{color:var(--ok)}.wait{color:var(--wait)}.empty{text-align:center;color:var(--mut);padding:40px 10px}
.paper{background:#fff;color:#1a1a2e;border-radius:12px;padding:18px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--pink);padding-bottom:12px;margin-bottom:10px}.ph img{border-radius:12px}
.paper h3{margin:6px 0;font-size:22px}.paper p{margin:2px 0}
.paper table{width:100%;border-collapse:collapse;margin:12px 0}.paper th{text-align:left;font-weight:600;color:#5b5f73;padding:7px 0;border-bottom:1px solid #e3e5ec}.paper td{text-align:right;padding:7px 0;border-bottom:1px solid #e3e5ec}
.tot{display:flex;justify-content:space-between;font-size:26px;font-weight:700;background:#25234A;color:#fff;border-radius:12px;padding:12px 14px}
.paper .st{margin-top:12px;font-weight:700;font-size:17px}.paper .ok{color:#178a4f}.paper .wait{color:#c27a00}
.pay{width:100%;margin-bottom:10px;font-weight:600}.pay.paid{background:var(--ok)}.alt{background:var(--card);color:var(--ink)}
.two .btn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px}
@media print{.toast{display:none}body{background:#fff}#app{padding:0}.bar,.btn,.two,.fab,footer{display:none!important}}
@media (prefers-reduced-motion:no-preference){.paper{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
.toast{position:fixed;left:14px;right:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:452px;margin:0 auto;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;text-align:center;z-index:9}.lock h2{font-size:26px;margin:18px 0 6px;text-transform:uppercase}.lock p{color:var(--mut);margin:0 0 14px}.devid{font:700 34px 'Arial Narrow',sans-serif;letter-spacing:.12em;text-align:center;background:var(--card);border-radius:16px;padding:16px;user-select:all;-webkit-user-select:all}.cp{width:100%;margin:10px 0 18px;font-weight:600}.logop{display:flex;align-items:center;gap:12px}.logop img{border-radius:12px;object-fit:cover}.logop .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;height:48px}</style></head><body>

let db={inv:[],n:0,pr:{},biz:{}};try{db=Object.assign(db,JSON.parse(localStorage.getItem('en')||'{}'))}catch(e){}

function setIcons(){const mk=rel=>{let l=document.querySelector(`link[rel="${rel}"]`);if(!l){l=document.createElement('link');l.rel=rel;document.head.appendChild(l)}l.href=bizLogo();return l};
mk('icon');mk('apple-touch-icon');
try{const mf={name:bizName(),short_name:bizName(),start_url:location.href,display:'standalone',background_color:'#DFE3EA',theme_color:'#25234A',icons:[160,192,512].map(s=>({src:bizLogo(),sizes:s+'x'+s,type:'image/png'}))};

const $=s=>document.querySelector(s),app=$('#app');
const fm=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const dm=n=>String(n).replace('.',','),dt=d=>new Date(d).toLocaleDateString('fr-FR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=(p,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const tp=id=>T.find(t=>t.id===id);
const bar=(t,b)=>`<div class="bar"><button class="ib" onclick="go('${b}')" aria-label="Retour">${ic(P.back)}</button><h2>${t}</h2></div>`;
let view='home',arg;
function go(v,a){view=v;arg=a;({home,pick,form,list,inv,setlock,setform})[v](a);scrollTo(0,0)}
function home(){
const paid=db.inv.filter(i=>i.paid).reduce((s,i)=>s+i.total,0),wait=db.inv.filter(i=>!i.paid).reduce((s,i)=>s+i.total,0);
app.innerHTML=`<header class="top"><img src="${bizLogo()}" alt="" width="64" height="64"><h1>${esc(bizName()).toUpperCase()}<br>${esc(bizTag()).toUpperCase()}</h1><button class="ib gearb" aria-label="Paramètres" onclick="go('setlock')">${ic(P.gear,22)}</button></header>
<section class="stats"><button class="btn stat" onclick="go('list','all')"><b>Argent total</b><span>${fm(paid)} FCFA encaissés</span><small>${fm(wait)} en attente</small></button>
<button class="btn stat" onclick="go('list','all')"><b>Toutes les factures</b><span>${db.inv.length} facture${db.inv.length>1?'s':''}</span></button></section>
<section class="grid">${T.map(t=>`<button class="btn type" onclick="go('form','${t.id}')">${ic(t.i,30)}<span>${t.n}</span></button>`).join('')}</section>
<button class="fab" aria-label="Nouvelle facture" onclick="go('pick')">${ic(P.plus,30)}</button><footer>@MPB GROUP</footer>`}
function pick(){app.innerHTML=`${bar('Type d’impression','home')}<section class="grid">${T.map(t=>`<button class="btn type" onclick="go('form','${t.id}')">${ic(t.i,30)}<span>${t.n}</span></button>`).join('')}</section>`}
function form(id){const t=tp(id);
app.innerHTML=`${bar(t.n,'home')}<main><div class="fld"><label for="p">Prix du m² (FCFA)</label><input id="p" inputmode="decimal" value="${db.pr[id]||''}"></div>
<div class="fld"><label for="c">Nom du client</label><input id="c" autocomplete="off"></div>
<div class="two"><div class="fld"><label for="h">Hauteur (m)</label><input id="h" inputmode="decimal"></div><div class="fld"><label for="w">Largeur (m)</label><input id="w" inputmode="decimal"></div></div>
<div class="sum"><span id="s"></span><b id="t"></b></div><p class="err" id="e" role="alert"></p><button class="btn go" id="ok">Créer la facture</button></main>`;

<button class="fab" aria-label="Nouvelle facture" onclick="go('pick')">${ic(P.plus,30)}</button><footer>@MPB GROUP</footer>`}

function mkpdf(rows,jb){
const H=595,o=[],jpg=atob(jb);
const c=rows.map(r=>`BT /${r.b?'F2':'F1'} ${r.s} Tf ${r.x} ${H-r.y} Td (${r.t.replace(/[^\x20-\xFF]/g,'?').replace(/[\\()]/g,'\\$&')}) Tj ET`).join('\n')+'\nq 62 0 0 62 34 499 cm /Im0 Do Q';
o[1]='<</Type/Catalog/Pages 2 0 R>>';o[2]='<</Type/Pages/Kids[3 0 R]/Count 1>>';
o[3]='<</Type/Page/Parent 2 0 R/MediaBox[0 0 420 595]/Contents 4 0 R/Resources<</Font<</F1 5 0 R/F2 6 0 R>>/XObject<</Im0 7 0 R>>>>>>';
o[4]=`<</Length ${c.length}>>\nstream\n${c}\nendstream`;
o[5]='<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>';
o[6]='<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>';
o[7]=`<</Type/XObject/Subtype/Image/Width 160/Height 160/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n${jpg}\nendstream`;
let s='%PDF-1.4\n',off=[];
for(let k=1;k<=7;k++){off[k]=s.length;s+=`${k} 0 obj\n${o[k]}\nendobj\n`}
const x=s.length;s+='xref\n0 8\n0000000000 65535 f \n'+off.slice(1).map(v=>String(v).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size 8/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;
return new Blob([Uint8Array.from(s,ch=>ch.charCodeAt(0))],{type:'application/pdf'})}
function toast(m){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}

{t:'Total : '+fm(i.total)+' FCFA',x:34,y:350,s:18,b:1},{t:i.paid?'Payé':'En attente de paiement',x:34,y:378,s:13,b:1}];

const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const h53=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const b32=(n,l)=>{let o='';for(let i=0;i<l;i++){o+=AL[n%32];n=Math.floor(n/32)}return o};
const clean=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const lic=id=>{id=clean(id);return b32(h53(SECRET+id,1),5)+b32(h53(id+SECRET,2),5)};
const licP=id=>{id=clean(id);return b32(h53(SECRET+id,3),5)+b32(h53(id+SECRET,4),5)};
function devId(){let d;try{d=localStorage.getItem('endev')}catch(e){}
if(!d){const a=window.crypto&&crypto.getRandomValues?crypto.getRandomValues(new Uint8Array(8)):Array.from({length:8},()=>Math.random()*256|0);d=[...a].map(v=>AL[v%32]).join('');d=d.slice(0,4)+'-'+d.slice(4);try{localStorage.setItem('endev',d)}catch(e){}}return d}
const licOk=()=>{try{return clean(localStorage.getItem('enlic')||'')===lic(devId())}catch(e){return false}};
function lock(){const id=devId();
app.innerHTML=`<header class="top"><img src="${LOGO}" alt="" width="64" height="64"><h1>EXPRESS NUMÉRIQUE<br>BY MPB GROUP</h1></header>
<main class="lock"><h2>Activer cet appareil</h2><p>Une licence fonctionne sur un seul téléphone. Envoie ce numéro à MPB Group pour recevoir ton code d’activation.</p>
<div class="devid" id="did">${id}</div><button class="btn alt cp" id="cp">Copier le numéro</button>
<div class="fld"><label for="lc">Code d’activation</label><input id="lc" autocomplete="off" autocapitalize="characters" placeholder="XXXXX-XXXXX"></div>
<p class="err" id="le" role="alert"></p><button class="btn go" id="la">Activer</button></main>`;
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(id);toast('Numéro copié.')}catch(e){toast('Appuie longtemps sur le numéro pour le copier.')}};
$('#la').onclick=()=>{const c=clean($('#lc').value);
if(c&&c===lic(id)){try{localStorage.setItem('enlic',c)}catch(e){}go('home')}else $('#le').textContent='Code incorrect pour cet appareil. Vérifie le numéro envoyé et le code reçu.'}}
const setOk=()=>{try{return clean(localStorage.getItem('ensetlic')||'')===licP(devId())}catch(e){return false}};
function setlock(){const id=devId();
app.innerHTML=`${bar('Paramètres','home')}<main class="lock"><p>Cette section est protégée par un code séparé du code d’activation. Envoie ce numéro à MPB Group pour recevoir le code des paramètres.</p>
<div class="devid" id="did">${id}</div><button class="btn alt cp" id="cp">Copier le numéro</button>
<div class="fld"><label for="lc">Code des paramètres</label><input id="lc" autocomplete="off" autocapitalize="characters" placeholder="XXXXX-XXXXX"></div>
<p class="err" id="le" role="alert"></p><button class="btn go" id="la">Déverrouiller</button></main>`;
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(id);toast('Numéro copié.')}catch(e){toast('Appuie longtemps sur le numéro pour le copier.')}};
$('#la').onclick=()=>{const c=clean($('#lc').value);
if(c&&c===licP(id)){try{localStorage.setItem('ensetlic',c)}catch(e){}go('setform')}else $('#le').textContent='Code incorrect pour cet appareil.'}}
function setform(){if(!setOk())return setlock();
app.innerHTML=`${bar('Paramètres de l’entreprise','home')}<main>
<div class="fld"><label for="bn">Nom affiché</label><input id="bn" value="${esc(db.biz.name||'')}" placeholder="EXPRESS NUMÉRIQUE"></div>
<div class="fld"><label for="bt">Sous-titre</label><input id="bt" value="${esc(db.biz.tag||'')}" placeholder="by MPB Group"></div>
<div class="fld"><label for="bp">Téléphone</label><input id="bp" inputmode="tel" value="${esc(db.biz.phone||'')}"></div>
<div class="fld"><label for="ba">Adresse</label><input id="ba" value="${esc(db.biz.addr||'')}"></div>
<div class="fld"><label>Logo</label><div class="logop"><img id="lp" src="${bizLogo()}" width="56" height="56" alt=""><button class="btn alt" id="lb" type="button">${ic(P.photo,20)} Changer le logo</button><input id="lf" type="file" accept="image/*" hidden></div></div>
<p class="err" id="le" role="alert"></p><button class="btn go" id="sv">Enregistrer</button></main>`;
let newLogo=null,newLogoJ=null;
$('#lb').onclick=()=>$('#lf').click();
$('#lf').onchange=()=>{const f=$('#lf').files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=160;c.height=160;const x=c.getContext('2d');
x.fillStyle='#fff';x.fillRect(0,0,160,160);const sc=Math.max(160/im.width,160/im.height),dw=im.width*sc,dh=im.height*sc;
x.drawImage(im,(160-dw)/2,(160-dh)/2,dw,dh);newLogo=c.toDataURL('image/png');newLogoJ=c.toDataURL('image/jpeg',.85).split(',')[1];$('#lp').src=newLogo};im.src=r.result};r.readAsDataURL(f)};
$('#sv').onclick=()=>{db.biz={name:$('#bn').value.trim(),tag:$('#bt').value.trim(),phone:$('#bp').value.trim(),addr:$('#ba').value.trim(),logo:newLogo||db.biz.logo,logoJ:newLogoJ||db.biz.logoJ};save();setIcons();toast('Paramètres enregistrés.');go('home')}}
licOk()?go('home'):lock();
</script></body></html>
